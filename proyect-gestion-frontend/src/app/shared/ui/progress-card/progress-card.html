<div class="bg-white rounded-xl p-5 shadow-sm">
  <div class="flex justify-between items-center mb-3 text-sm text-gray-600">
    <span>{{ title() }}</span>
    <strong class="text-gray-800">
      {{ value() }}%
    </strong>
  </div>
  <div class="h-2.5 bg-gray-100 rounded-full overflow-hidden mb-2">
    <div
      class="h-full rounded-full transition-all duration-500 bg-gradient-to-r"
      [class]="progressColor()"
      [style.width.%]="value()"
    ></div>
  </div>
  <div class="flex justify-between text-xs text-gray-400">
    <span>{{ leftLabel() }}</span>
    <span>{{ rightLabel() }}</span>
  </div>
</div>
