<aside
  class="flex flex-col h-screen bg-slate-800 text-white transition-all duration-300 overflow-hidden sticky top-0"
  [class.w-60]="!collapsed()"
  [class.w-16]="collapsed()"
>
  <!-- logo -->
  <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10 min-h-16">
    <div class="w-9 h-9 bg-blue-500 rounded-xl flex items-center justify-center text-lg font-bold shrink-0">G</div>
    @if (!collapsed()) {
      <span class="text-lg font-bold whitespace-nowrap">GestiónPro</span>
    }
  </div>

  <!-- nav -->
  <nav class="flex-1 flex flex-col gap-4 overflow-y-auto px-2 py-4">
    @for (item of visibleItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-500 text-white"
        class="flex items-center gap-3 rounded-lg text-white text-sm font-medium transition-all px-3 py-2 hover:bg-white/10 hover:text-white no-underline whitespace-nowrap"
        (click)="closeSidebar.emit()"
        [title]="collapsed() ? item.label : ''"
      >
        <span class="text-xl shrink-0 w-6 text-center">{{ item.icon }}</span>
        @if (!collapsed()) {
          <span class="overflow-hidden">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- usuario y logout -->
  <div class="flex justify-between flex-col px-3 py-3 border-t border-white/10 gap-2">
    @if (!collapsed()) {
      <div class="flex items-center gap-2 overflow-hidden">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold shrink-0">
          {{ username().charAt(0).toUpperCase() }}
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="text-sm font-semibold text-white truncate">{{ username() }}</span>
          <span class="text-xs text-white/50">{{ isAdmin() ? 'Administrador' : 'Usuario' }}</span>
        </div>
      </div>
    }
    <!-- boton de logout con icono svg -->
    <button
      class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-red-400 transition-colors hover:bg-red-600 hover:text-white no-underline whitespace-nowrap"
      (click)="logout()"
      title="Cerrar sesión"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
      </svg>
      @if (!collapsed()) {
        <span>Cerrar sesión</span>
      }
    </button>
  </div>
</aside>
