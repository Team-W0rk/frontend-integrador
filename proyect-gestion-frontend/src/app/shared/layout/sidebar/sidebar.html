<aside
  class="flex flex-col h-screen bg-slate-800 text-white transition-all duration-250 overflow-hidden sticky top-0 padding-aside"
  [class.w-60]="!collapsed()"
  [class.w-16]="collapsed()"
>
  <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10 min-h-16">
    <div class="w-9 h-9 bg-blue-500 rounded-xl flex items-center justify-center text-lg font-bold shrink-0">G</div>
    @if (!collapsed()) {
      <span class="text-lg font-bold whitespace-nowrap">GestiónPro</span>
    }
  </div>
  <nav class="flex-1 flex flex-col gap-4 overflow-y-auto padding-nav">
    @for (item of visibleItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-500 text-white"
        class="flex items-center gap-3 rounded-lg text-white text-sm font-medium transition-all padding-nav-item hover:bg-white/10 hover:text-white no-underline whitespace-nowrap"
        (click)="closeSidebar.emit()"
        [title]="collapsed() ? item.label : ''"
      >
        <span class="text-xl shrink-0 w-6 text-center">{{ item.icon }}</span>
        @if (!collapsed()) {
          <span class="overflow-hidden">{{ item.label }}</span>
        }
      </a>
    }
  </nav>
  <div class="flex justify-between flex-col px-3 py-3 border-t border-white/10 gap-2 padding-aside">
    @if (!collapsed()) {
      <div class="flex items-center gap-2 overflow-hidden">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm font-bold shrink-0">
          {{ username().charAt(0).toUpperCase() }}
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="text-sm font-semibold text-white truncate">{{ username() }}</span>
          <span class="text-xs text-white/50">{{ isAdmin() ? 'Administrador' : 'Usuario' }}</span>
        </div>
      </div>
    }
    <button
      class="bg-transparent border-0 cursor-pointer text-left text-ml padding-nav-item rounded-lg transition-colors hover:bg-white/10 hover:underline shrink-0"
      (click)="logout()"
      title="Cerrar sesión"
    >
      Cerrar sesión
    </button>
  </div>
</aside>
