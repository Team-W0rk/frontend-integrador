<header class="flex items-center justify-between h-16 header-padding bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
  <div class="flex items-center gap-4">
    <!-- boton hamburguesa -->
    <button
      class="p-2 rounded-lg border-0 bg-transparent cursor-pointer hover:bg-slate-100 transition-colors"
      (click)="toggleSidebar.emit()"
      title="Menú"
    >
      <span class="text-xl text-slate-500 leading-none">☰</span>
    </button>
  </div>

  <!-- usuariioy  logout -->
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-1 chip-navbar bg-slate-50 border border-slate-200 rounded-full px-2 py-1">
      <div class="w-7 h-7 bg-blue-500 text-white rounded-full flex items-center justify-center text-xs font-bold">
        {{ username().charAt(0).toUpperCase() }}
      </div>
      <span class="text-sm font-medium text-gray-700 hidden sm:block">{{ username() }}</span>
      <span class="text-xs text-gray-500 hidden sm:block">({{ isAdmin() ? 'Administrador' : 'Usuario' }})</span>
    </div>
    <button
      class="p-2 rounded-lg border-0 bg-transparent cursor-pointer text-lg text-red-400 hover:bg-red-600 hover:text-white transition-colors"
      (click)="logout()"
      title="Cerrar sesión"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
      </svg>
    </button>
  </div>
</header>
